[package]
name = "loomd"
version = "1.0.0"
edition = "2021"
description = "PipeWire Loom helper: CLI pw-dump poller speaking the Loom NDJSON schema. Native libpipewire mode is parked for v1.0."
license = "MIT"
publish = false

[[bin]]
name = "loomd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
