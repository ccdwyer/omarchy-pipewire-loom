[package]
name = "loomd"
version = "1.0.0"
edition = "2021"
description = "PipeWire Loom helper: NDJSON graph events. CLI poller by default; optional libpipewire subscribe."
license = "MIT"
publish = false

[[bin]]
name = "loomd"
path = "src/main.rs"

[features]
default = []
pipewire = ["dep:pipewire"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pipewire = { version = "0.8", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
